<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>superplexr</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23161b22'/%3E%3Cpath d='M4 5l3 3-3 3M8 11h4' stroke='%2358d3a3' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<header class="bar">
  <span class="brand">superplexr</span>
  <span id="link" class="link" data-state="connecting">connecting</span>
  <span class="grow"></span>
  <div id="control" class="control" hidden></div>
  <button id="replay-toggle" class="button quiet" hidden title="play this session's recording">▶ replay</button>
  <button id="new-shell" class="button" hidden>new shell</button>
  <button id="forget" class="button quiet" hidden title="forget this device's pairing">forget</button>
</header>

<section id="pair" class="pair" hidden>
  <form id="pair-form">
    <p class="lede">Pair this browser with the runtime.</p>
    <p class="hint">On the machine that runs superplexr: <code>superplexr device-pair --label browser</code>, then type the code it shows.</p>
    <label>Pairing code <input id="pair-code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" required></label>
    <button class="button" type="submit">pair</button>
    <p id="pair-error" class="error" hidden></p>
  </form>
</section>

<main id="main" class="main" hidden>
  <nav id="sessions" class="sessions" aria-label="sessions"></nav>
  <section class="stage">
    <canvas id="screen" tabindex="0" aria-label="terminal"></canvas>
    <div id="empty" class="empty">pick a session, or start a shell</div>
    <div id="replay" class="replay" hidden></div>
    <div id="status" class="status"></div>
  </section>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
