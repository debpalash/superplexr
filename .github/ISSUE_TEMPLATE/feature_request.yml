name: Feature request
description: Propose a focused improvement to SuperPlexr.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior you want without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Relevant boundaries
      description: Note any Mission, Run, Session, Surface, authority, remote, or platform implications.
