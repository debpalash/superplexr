[package]
name = "ultraplexr-desktop"
description = "Native GPUI desktop for ultraplexr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap.workspace = true
gpui = { workspace = true, features = ["profiler"] }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
ultraplexr-client = { path = "../ultraplexr-client" }
ultraplexr-core = { path = "../ultraplexr-core" }
ultraplexr-protocol = { path = "../ultraplexr-protocol" }
ultraplexr-server = { path = "../ultraplexr-server" }
ultraplexr-terminal = { path = "../ultraplexr-terminal" }
ultraplexr-verification = { path = "../ultraplexr-verification" }
tokio.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
ultraplexr-observer = { path = "../ultraplexr-observer" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio-stream = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_apple = { workspace = true, features = ["runtime_shaders"] }
gpui_platform = { workspace = true, features = ["font-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
