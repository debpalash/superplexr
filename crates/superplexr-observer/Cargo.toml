[package]
name = "superplexr-observer"
description = "Optional localhost read-only browser observer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio-stream = "0.1"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
superplexr-core = { path = "../superplexr-core" }
superplexr-client = { path = "../superplexr-client" }
superplexr-protocol = { path = "../superplexr-protocol" }
superplexr-terminal = { path = "../superplexr-terminal" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
