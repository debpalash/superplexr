[[dependency]]
name = "gpui"
source = "https://github.com/zed-industries/zed"
revision = "bce0c5785bfd9172c939aca4083fd70bc4930927"
archive_sha256 = "271e235389919045ef5bd4e12c7beed42fc30621054d918b3130d5907b8fa75a"
license = "Apache-2.0; unapproved auxiliary crates replaced by local MIT OR Apache-2.0 compatibility seams"
enabled_features = ["font-kit", "runtime_shaders", "wayland", "x11"]
audit = "accepted-m1-behind-desktop-seam"
notes = "Pre-1.0; GPUI types remain isolated in termi9ne-desktop. Upstream ztracing is GPL-3.0-or-later, while gpui_util and gpui_shared_string have no package license at this revision. Cargo patches all three names to independently implemented local compatibility crates. The CI license gate rejects remote resolution, undeclared licenses, and copyleft-only normal/build dependencies. macOS compiles Metal shaders at app startup so Command Line Tools-only development hosts can build."

[[local_patch]]
name = "gpui_shared_string"
path = "crates/gpui-shared-string-compat"
replaces = "https://github.com/zed-industries/zed@bce0c5785bfd9172c939aca4083fd70bc4930927/crates/gpui_shared_string"
license = "MIT OR Apache-2.0"
rationale = "The upstream package declares no license. This independent implementation supplies the immutable shared-string interface used by GPUI."
verification = "unit equality/hash contract; macOS and Linux GPUI compile/test/package matrix"

[[local_patch]]
name = "gpui_util"
path = "crates/gpui-util-compat"
replaces = "https://github.com/zed-industries/zed@bce0c5785bfd9172c939aca4083fd70bc4930927/crates/gpui_util"
license = "MIT OR Apache-2.0"
rationale = "The upstream package declares no license. This independent implementation supplies the bounded utility interfaces used by the selected GPUI closure."
verification = "unit guard/result contracts; macOS and Linux GPUI compile/test/package matrix"

[[local_patch]]
name = "ztracing"
path = "crates/ztracing-compat"
replaces = "https://github.com/zed-industries/zed@bce0c5785bfd9172c939aca4083fd70bc4930927/crates/ztracing"
license = "MIT OR Apache-2.0"
rationale = "The upstream package is GPL-3.0-or-later. The selected GPUI closure only consumes the instrument attribute, independently supplied by re-exporting tracing::instrument."
verification = "Cargo inverse-tree source assertion; macOS and Linux GPUI compile/test/package matrix"

