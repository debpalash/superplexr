[workspace]
members = [
    "crates/superplexr-core",
    "crates/superplexr-protocol",
    "crates/superplexr-client",
    "crates/superplexr-server",
    "crates/superplexr-cli",
    "crates/superplexr-mcp",
    "crates/superplexr-terminal",
    "crates/superplexr-runtime",
    "crates/superplexr-plugin",
    "crates/superplexr-desktop",
    "crates/superplexr-daemon",
    "crates/gpui-shared-string-compat",
    "crates/gpui-util-compat",
    "crates/ztracing-compat",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "bce0c5785bfd9172c939aca4083fd70bc4930927", default-features = false }
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "bce0c5785bfd9172c939aca4083fd70bc4930927", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "bce0c5785bfd9172c939aca4083fd70bc4930927", default-features = false }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "f4c72b931588cb3e53db0ea8470eaa1b2e5427d9", default-features = false }
portable-pty = "0.9.0"
prost = "0.14.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
# Network gateway: TLS with a self-signed identity that devices pin by fingerprint.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = { version = "0.17", default-features = false }
sysinfo = "0.31.4"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
libc = "0.2"
zstd = "0.13.3"

[patch."https://github.com/zed-industries/zed"]
gpui_shared_string = { path = "crates/gpui-shared-string-compat" }
gpui_util = { path = "crates/gpui-util-compat" }
ztracing = { path = "crates/ztracing-compat" }

# `cargo run` is the primary local-product loop. Unoptimized GPUI, text
# shaping, serde, and VT parsing produce a build that is not representative of
# the application and can miss a display deadline even when the architecture is
# sound. Keep workspace code lightly optimized for useful debugging and compile
# third-party hot paths at production speed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
